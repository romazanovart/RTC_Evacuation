<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FROB · Поле</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b28;color:#e8f1fa;font:16px system-ui}header{position:sticky;top:0;background:#101b28;z-index:2;padding:12px;display:flex;gap:12px;align-items:center}header strong{flex:1}button,select,textarea{font:inherit;border:1px solid #6b8599;border-radius:10px;padding:12px;background:#213448;color:inherit}button{cursor:pointer;min-height:46px}button:disabled{opacity:.45}.stop{background:#b32b40}main{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px}section{min-width:0;background:#182839;padding:14px;border-radius:16px}canvas{width:100%;height:auto;touch-action:manipulation;border-radius:12px}.tools{display:flex;gap:7px;flex-wrap:wrap}.tools button.active{background:#197c78}textarea{width:100%;min-height:80px;margin:10px 0}.muted{color:#afc1d0;font-size:13px}.message{white-space:pre-wrap;background:#243b50;padding:12px;margin:10px 0;border-radius:12px;overflow-wrap:anywhere}.message img{max-width:100%;border-radius:8px}#chat{max-height:60vh;overflow:auto}#status{min-height:24px}a{color:#94dfed}@media(max-width:760px){main{grid-template-columns:1fr}header{font-size:14px}.tools button{flex:1 0 28%}}
</style><style>main{max-width:760px;grid-template-columns:1fr}</style><header><strong>FROB / Карта</strong><button class="stop" id="stop">СТОП</button></header>
